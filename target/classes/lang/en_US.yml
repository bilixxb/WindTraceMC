    traceA:
      displayName: "§eAura of Detection"
      Lore:
        - ""
        - "§eScan the surrounding area. If a rebel is detected, mark their movement trail for 5 seconds."
        - "§eCooldown 4s, 3 charges."
    captureE:
      displayName: "§eCapture!"
      Lore:
        - ""
        - "§eReveal and capture a nearby rebel, eliminating them instantly."
        - "§eCooldown 5s, 3 charges."
