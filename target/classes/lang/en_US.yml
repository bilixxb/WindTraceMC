      displayName: "§dFreezing Curse"
      Lore:
        - ""
        - "§eRandomly reveal one rebel and freeze them for 10 seconds. They cannot leave the area and cannot be captured during this time."
        - "§eThis is an ultimate skill obtained after picking up Grace of Favor, usable once per game."
  rebel:
    invisA:
      displayName: "§eVanishing Trick"
      Lore:
        - ""
        - "§eBecome invisible for 5 seconds and remove your current disguise."
        - "§eCooldown 30s."
    disguiseE:
      displayName: "§eDisguise"
      Lore:
        - ""
        - "§eRandomly transform into a block or remove disguise."
        - "§eNo cooldown."
    quickenStepsQ:
      displayName: "§dSwift Steps"
      Lore:
        - ""
        - "§eGreatly increase movement speed for 30 seconds."
        - "§eThis is an ultimate skill obtained after picking up Grace of Favor, usable once per game."

